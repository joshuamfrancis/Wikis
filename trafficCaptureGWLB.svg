<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="820" viewBox="0 0 1240 820" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arw" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#37474f"/>
    </marker>
    <marker id="arwOrange" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e8710a"/>
    </marker>
    <marker id="arwGreen" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1e8e3e"/>
    </marker>
  </defs>

  <rect width="1240" height="820" fill="#f7f9fa"/>
  <text x="30" y="42" font-size="23" font-weight="600" fill="#1a2027">On-Demand Full Packet Capture — GWLB Inspection Fleet</text>
  <text x="30" y="65" font-size="13" fill="#5f6b74">Central Network Account · Appliance Mode enabled on TGW attachment · pcap triggered via SSM, shipped to S3</text>

  <!-- Spokes -->
  <rect x="30" y="120" width="180" height="230" rx="8" fill="#fff" stroke="#8e24aa" stroke-width="1.5"/>
  <text x="120" y="145" font-size="13" font-weight="600" fill="#8e24aa" text-anchor="middle">Spoke Accounts</text>
  <rect x="50" y="160" width="140" height="48" rx="5" fill="#f3e5f5" stroke="#ba68c8"/>
  <text x="120" y="182" font-size="12" fill="#4a148c" text-anchor="middle">Prod VPC</text>
  <text x="120" y="198" font-size="10" fill="#7b1fa2" text-anchor="middle">workloads</text>
  <rect x="50" y="220" width="140" height="48" rx="5" fill="#f3e5f5" stroke="#ba68c8"/>
  <text x="120" y="242" font-size="12" fill="#4a148c" text-anchor="middle">Dev VPC</text>
  <text x="120" y="258" font-size="10" fill="#7b1fa2" text-anchor="middle">workloads</text>
  <rect x="50" y="280" width="140" height="48" rx="5" fill="#f3e5f5" stroke="#ba68c8"/>
  <text x="120" y="302" font-size="12" fill="#4a148c" text-anchor="middle">Shared Svcs VPC</text>
  <text x="120" y="318" font-size="10" fill="#7b1fa2" text-anchor="middle">workloads</text>

  <!-- TGW -->
  <rect x="250" y="190" width="120" height="90" rx="8" fill="#fff3e0" stroke="#e8710a" stroke-width="2"/>
  <text x="310" y="222" font-size="13" font-weight="600" fill="#b45309" text-anchor="middle">Transit</text>
  <text x="310" y="240" font-size="13" font-weight="600" fill="#b45309" text-anchor="middle">Gateway</text>
  <text x="310" y="262" font-size="10" fill="#e8710a" text-anchor="middle">appliance mode ✓</text>

  <line x1="210" y1="235" x2="248" y2="235" stroke="#37474f" stroke-width="2" marker-end="url(#arw)"/>

  <!-- Inspection VPC -->
  <rect x="410" y="100" width="470" height="440" rx="10" fill="#fff" stroke="#1565c0" stroke-width="2"/>
  <text x="430" y="126" font-size="14" font-weight="600" fill="#1565c0">Inspection VPC (Central Network Account)</text>

  <line x1="370" y1="235" x2="450" y2="235" stroke="#37474f" stroke-width="2" marker-end="url(#arw)"/>
  <rect x="430" y="150" width="120" height="40" rx="5" fill="#e3f2fd" stroke="#64b5f6"/>
  <text x="490" y="175" font-size="11" fill="#0d47a1" text-anchor="middle">TGW Subnets</text>

  <!-- GWLB -->
  <rect x="600" y="150" width="240" height="70" rx="8" fill="#e8f0fe" stroke="#1565c0" stroke-width="2"/>
  <text x="720" y="180" font-size="14" font-weight="600" fill="#0d47a1" text-anchor="middle">Gateway Load Balancer</text>
  <text x="720" y="202" font-size="11" fill="#1565c0" text-anchor="middle">GENEVE encap · UDP 6081 · 5-tuple flow stickiness</text>

  <line x1="490" y1="220" x2="490" y2="245" stroke="#37474f" stroke-width="2"/>
  <line x1="490" y1="245" x2="596" y2="200" stroke="#37474f" stroke-width="2" marker-end="url(#arw)"/>

  <!-- Appliance fleet -->
  <rect x="440" y="250" width="410" height="260" rx="8" fill="#fafafa" stroke="#90a4ae" stroke-dasharray="5,4"/>
  <text x="645" y="275" font-size="12" font-weight="600" fill="#546e7a" text-anchor="middle">Appliance Auto Scaling Group (GWLB target group)</text>

  <g>
    <rect x="465" y="295" width="115" height="130" rx="6" fill="#e6f4ea" stroke="#1e8e3e" stroke-width="1.5"/>
    <text x="522" y="318" font-size="11" font-weight="600" fill="#0d652d" text-anchor="middle">Appliance AZ-a</text>
    <text x="522" y="340" font-size="10" fill="#37474f" text-anchor="middle">Suricata / Zeek</text>
    <rect x="478" y="352" width="90" height="30" rx="4" fill="#fff" stroke="#1e8e3e" stroke-dasharray="3,3"/>
    <text x="523" y="366" font-size="9" fill="#0d652d" text-anchor="middle">tcpdump agent</text>
    <text x="523" y="377" font-size="8" fill="#5f6b74" text-anchor="middle">(idle until triggered)</text>
    <text x="522" y="401" font-size="9" fill="#5f6b74" text-anchor="middle">iface: gnv0</text>
    <text x="522" y="415" font-size="9" fill="#5f6b74" text-anchor="middle">EBS pcap vol</text>
  </g>
  <g>
    <rect x="595" y="295" width="115" height="130" rx="6" fill="#e6f4ea" stroke="#1e8e3e" stroke-width="1.5"/>
    <text x="652" y="318" font-size="11" font-weight="600" fill="#0d652d" text-anchor="middle">Appliance AZ-b</text>
    <text x="652" y="340" font-size="10" fill="#37474f" text-anchor="middle">Suricata / Zeek</text>
    <rect x="608" y="352" width="90" height="30" rx="4" fill="#fff" stroke="#1e8e3e" stroke-dasharray="3,3"/>
    <text x="653" y="366" font-size="9" fill="#0d652d" text-anchor="middle">tcpdump agent</text>
    <text x="653" y="377" font-size="8" fill="#5f6b74" text-anchor="middle">(idle until triggered)</text>
    <text x="652" y="401" font-size="9" fill="#5f6b74" text-anchor="middle">iface: gnv0</text>
    <text x="652" y="415" font-size="9" fill="#5f6b74" text-anchor="middle">EBS pcap vol</text>
  </g>
  <g>
    <rect x="725" y="295" width="115" height="130" rx="6" fill="#e6f4ea" stroke="#1e8e3e" stroke-width="1.5"/>
    <text x="782" y="318" font-size="11" font-weight="600" fill="#0d652d" text-anchor="middle">Appliance AZ-c</text>
    <text x="782" y="340" font-size="10" fill="#37474f" text-anchor="middle">Suricata / Zeek</text>
    <rect x="738" y="352" width="90" height="30" rx="4" fill="#fff" stroke="#1e8e3e" stroke-dasharray="3,3"/>
    <text x="783" y="366" font-size="9" fill="#0d652d" text-anchor="middle">tcpdump agent</text>
    <text x="783" y="377" font-size="8" fill="#5f6b74" text-anchor="middle">(idle until triggered)</text>
    <text x="782" y="401" font-size="9" fill="#5f6b74" text-anchor="middle">iface: gnv0</text>
    <text x="782" y="415" font-size="9" fill="#5f6b74" text-anchor="middle">EBS pcap vol</text>
  </g>

  <line x1="640" y1="222" x2="522" y2="292" stroke="#1565c0" stroke-width="1.5" marker-end="url(#arw)"/>
  <line x1="720" y1="222" x2="652" y2="292" stroke="#1565c0" stroke-width="1.5" marker-end="url(#arw)"/>
  <line x1="800" y1="222" x2="782" y2="292" stroke="#1565c0" stroke-width="1.5" marker-end="url(#arw)"/>
  <text x="880" y="195" font-size="10" fill="#1565c0">inspected traffic</text>
  <text x="880" y="209" font-size="10" fill="#1565c0">returns to GWLB → TGW</text>

  <!-- Egress -->
  <rect x="430" y="470" width="120" height="45" rx="6" fill="#eceff1" stroke="#607d8b"/>
  <text x="490" y="490" font-size="11" fill="#37474f" text-anchor="middle">NAT GW /</text>
  <text x="490" y="505" font-size="11" fill="#37474f" text-anchor="middle">IGW → Internet</text>

  <!-- Control plane -->
  <rect x="920" y="100" width="290" height="230" rx="10" fill="#fff" stroke="#e8710a" stroke-width="2"/>
  <text x="940" y="126" font-size="14" font-weight="600" fill="#b45309">On-Demand Control Plane</text>

  <rect x="945" y="145" width="240" height="42" rx="5" fill="#fff3e0" stroke="#e8710a"/>
  <text x="1065" y="163" font-size="11" font-weight="600" fill="#b45309" text-anchor="middle">EventBridge / Operator</text>
  <text x="1065" y="178" font-size="9" fill="#e8710a" text-anchor="middle">alarm, ticket ID, or manual trigger</text>

  <rect x="945" y="205" width="240" height="42" rx="5" fill="#fff3e0" stroke="#e8710a"/>
  <text x="1065" y="223" font-size="11" font-weight="600" fill="#b45309" text-anchor="middle">Lambda — capture orchestrator</text>
  <text x="1065" y="238" font-size="9" fill="#e8710a" text-anchor="middle">params: duration, BPF filter, snaplen</text>

  <rect x="945" y="265" width="240" height="45" rx="5" fill="#fff3e0" stroke="#e8710a"/>
  <text x="1065" y="284" font-size="11" font-weight="600" fill="#b45309" text-anchor="middle">SSM Run Command</text>
  <text x="1065" y="299" font-size="9" fill="#e8710a" text-anchor="middle">targets ASG by tag · start / TTL stop</text>

  <line x1="1065" y1="187" x2="1065" y2="203" stroke="#e8710a" stroke-width="2" marker-end="url(#arwOrange)"/>
  <line x1="1065" y1="247" x2="1065" y2="263" stroke="#e8710a" stroke-width="2" marker-end="url(#arwOrange)"/>
  <path d="M 945 300 C 880 320, 880 350, 850 355" fill="none" stroke="#e8710a" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arwOrange)"/>
  <text x="880" y="337" font-size="9" fill="#e8710a">start/stop pcap</text>

  <!-- S3 -->
  <rect x="920" y="400" width="290" height="140" rx="10" fill="#e6f4ea" stroke="#1e8e3e" stroke-width="2"/>
  <text x="1065" y="428" font-size="14" font-weight="600" fill="#0d652d" text-anchor="middle">S3 — pcap bucket</text>
  <text x="1065" y="452" font-size="10" fill="#1e8e3e" text-anchor="middle">SSE-KMS · Object Lock · versioned</text>
  <text x="1065" y="472" font-size="10" fill="#37474f" text-anchor="middle">s3://…/capture-id=&lt;ticket&gt;/az=&lt;az&gt;/</text>
  <text x="1065" y="490" font-size="10" fill="#37474f" text-anchor="middle">rotated by -G / -W, uploaded via -z hook</text>
  <text x="1065" y="512" font-size="10" fill="#1e8e3e" text-anchor="middle">Lifecycle → Glacier → expire</text>
  <text x="1065" y="530" font-size="10" fill="#5f6b74" text-anchor="middle">Athena / Wireshark for analysis</text>

  <path d="M 850 420 C 890 430, 895 460, 916 466" fill="none" stroke="#1e8e3e" stroke-width="2.5" marker-end="url(#arwGreen)"/>
  <text x="855" y="452" font-size="10" fill="#1e8e3e">pcap upload</text>

  <line x1="490" y1="430" x2="490" y2="466" stroke="#37474f" stroke-width="1.5" marker-end="url(#arw)"/>

  <!-- Legend / notes -->
  <rect x="30" y="580" width="1180" height="200" rx="10" fill="#fff" stroke="#cfd8dc"/>
  <text x="50" y="608" font-size="13" font-weight="600" fill="#1a2027">Design notes</text>
  <text x="50" y="634" font-size="11.5" fill="#37474f">1.  Appliance mode on the inspection-VPC TGW attachment pins both directions of a flow to the same AZ — required for stateful inspection and for coherent bidirectional pcaps.</text>
  <text x="50" y="658" font-size="11.5" fill="#37474f">2.  Capture on the decapsulated GENEVE interface (gnv0), not the raw ENI. On eth0 you would need a `udp port 6081` filter and post-processing to strip GENEVE headers.</text>
  <text x="50" y="682" font-size="11.5" fill="#37474f">3.  Agents are installed but idle. Nothing writes to disk until SSM fires; a scheduled TTL stop guarantees captures never run away and fill the volume.</text>
  <text x="50" y="706" font-size="11.5" fill="#37474f">4.  Write pcaps to a dedicated EBS volume or tmpfs — never the root volume. Use `-s 96` for headers-only unless full payloads are genuinely required.</text>
  <text x="50" y="730" font-size="11.5" fill="#37474f">5.  Coverage caveat: this sees everything crossing the TGW (inter-VPC + egress). Intra-VPC / intra-subnet lateral traffic never reaches the inspection VPC — that still needs</text>
  <text x="68" y="748" font-size="11.5" fill="#37474f">VPC Traffic Mirroring on the specific ENIs, or subnet segmentation that forces lateral flows through the TGW.</text>
  <text x="50" y="770" font-size="11.5" fill="#37474f">6.  Cross-account access to the pcap bucket via bucket policy + IAM role; the appliance instance profile needs only s3:PutObject on its capture-id prefix.</text>
</svg>