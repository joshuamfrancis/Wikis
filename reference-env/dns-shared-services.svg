<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 940" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#1565c0"/></marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#2e7d32"/></marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#e65100"/></marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#7b3fa0"/></marker>
    <style>
      .acctlbl{font-size:13px;font-weight:700;letter-spacing:.3px;}
      .vpclbl{font-size:11.5px;font-weight:600;fill:#2f6fb0;}
      .boxlbl{font-size:11px;font-weight:600;}
      .sub{font-size:9.5px;fill:#616e7c;}
      .title{font-size:21px;font-weight:700;fill:#1f2933;}
      .legend{font-size:11px;fill:#3e4c59;}
    </style>
  </defs>

  <text x="40" y="40" class="title">Route 53 PHZ in Shared-Services Account — Centralized DNS</text>

  <!-- ON-PREM -->
  <rect x="40" y="78" width="220" height="150" rx="10" fill="#f4f1ea" stroke="#b0855b" stroke-width="1.5"/>
  <text x="58" y="102" class="acctlbl" fill="#8a5a2b">ON-PREM DATA CENTER</text>
  <rect x="62" y="120" width="176" height="60" rx="6" fill="#fff" stroke="#b0855b" stroke-width="1.5"/>
  <text x="78" y="142" class="boxlbl" fill="#8a5a2b">On-prem DNS</text>
  <text x="78" y="158" class="sub">cond. fwd: aws.example.internal</text>
  <text x="78" y="171" class="sub">→ inbound endpoint IPs</text>

  <line x1="260" y1="150" x2="380" y2="150" stroke="#1f2933" stroke-width="2.5"/>
  <text x="266" y="142" class="sub" font-weight="600">Direct Connect</text>

  <!-- NETWORK ACCOUNT -->
  <rect x="380" y="78" width="470" height="470" rx="10" fill="#fafafa" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="398" y="102" class="acctlbl" fill="#52606d">CENTRAL NETWORK ACCOUNT</text>

  <rect x="410" y="115" width="110" height="46" rx="6" fill="#ffe9d6" stroke="#e65100" stroke-width="1.5"/>
  <text x="422" y="135" class="boxlbl" fill="#bf4500">Transit Gateway</text>
  <text x="422" y="150" class="sub">RAM-shared</text>

  <rect x="402" y="180" width="430" height="240" rx="8" fill="#eef4fb" stroke="#5b8def" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="416" y="200" class="vpclbl">Central Resolver VPC (has DX path to on-prem)</text>

  <rect x="420" y="215" width="190" height="58" rx="6" fill="#e3eefc" stroke="#1565c0" stroke-width="1.5"/>
  <text x="434" y="236" class="boxlbl" fill="#0d47a1">Inbound Resolver Endpoint</text>
  <text x="434" y="252" class="sub">resolves PHZ assoc. to this VPC</text>
  <text x="434" y="265" class="sub">on-prem &amp; spokes target these IPs</text>

  <rect x="625" y="215" width="190" height="58" rx="6" fill="#fde7e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="639" y="236" class="boxlbl" fill="#bf4500">Outbound Resolver Endpoint</text>
  <text x="639" y="252" class="sub">executes FORWARD rules</text>
  <text x="639" y="265" class="sub">to on-prem / inbound IPs</text>

  <rect x="420" y="290" width="395" height="115" rx="6" fill="#fff8e1" stroke="#c79100" stroke-width="1.5"/>
  <text x="434" y="311" class="boxlbl" fill="#a07800">Resolver Forwarding Rules (created here, RAM-shared)</text>
  <text x="434" y="332" class="sub">① on-prem zones (corp.example.com) → on-prem DNS</text>
  <text x="434" y="349" class="sub">② aws.example.internal → inbound endpoint IPs  (optional, hub-forward model)</text>
  <text x="434" y="366" class="sub">③ default reverse / split-horizon rules as needed</text>
  <text x="434" y="389" class="sub" font-style="italic">Rules reference the outbound endpoint above.</text>

  <!-- SHARED SERVICES ACCOUNT -->
  <rect x="880" y="78" width="360" height="230" rx="10" fill="#f3e8fb" stroke="#7b3fa0" stroke-width="1.5"/>
  <text x="898" y="102" class="acctlbl" fill="#5e2b80">SHARED-SERVICES (DNS) ACCOUNT</text>

  <rect x="900" y="118" width="320" height="110" rx="6" fill="#e3f2e8" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="916" y="140" class="boxlbl" fill="#1b5e20">Private Hosted Zones (owned here)</text>
  <text x="916" y="159" class="sub">aws.example.internal, db.example.internal …</text>
  <text x="916" y="178" class="sub">Associations (cross-account):</text>
  <text x="916" y="194" class="sub">• → Central Resolver VPC  (so inbound resolves)</text>
  <text x="916" y="209" class="sub">• → each spoke VPC  (option A, direct resolution)</text>

  <rect x="900" y="240" width="320" height="52" rx="6" fill="#fff" stroke="#7b3fa0" stroke-width="1.5"/>
  <text x="916" y="261" class="boxlbl" fill="#5e2b80">(optional) small DNS VPC</text>
  <text x="916" y="278" class="sub">holds a VPC to anchor associations / future endpoints</text>

  <!-- SPOKE ACCOUNTS -->
  <rect x="880" y="330" width="360" height="105" rx="10" fill="#fafafa" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="898" y="353" class="acctlbl" fill="#52606d">SPOKE ACCOUNT A — Workload VPC</text>
  <rect x="900" y="363" width="150" height="58" rx="6" fill="#fff" stroke="#5b8def" stroke-width="1.5"/>
  <text x="914" y="384" class="boxlbl" fill="#2f6fb0">.2 Resolver</text>
  <text x="914" y="400" class="sub">PHZ assoc (A) OR</text>
  <text x="914" y="413" class="sub">fwd rule → inbound (B)</text>
  <rect x="1065" y="363" width="155" height="58" rx="6" fill="#fff8e1" stroke="#c79100" stroke-width="1.5"/>
  <text x="1079" y="384" class="boxlbl" fill="#a07800">Shared rule assoc.</text>
  <text x="1079" y="400" class="sub">on-prem fwd rule</text>
  <text x="1079" y="413" class="sub">associated to VPC</text>

  <rect x="880" y="448" width="360" height="100" rx="10" fill="#fafafa" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="898" y="471" class="acctlbl" fill="#52606d">SPOKE ACCOUNT B — Workload VPC</text>
  <rect x="900" y="481" width="150" height="52" rx="6" fill="#fff" stroke="#5b8def" stroke-width="1.5"/>
  <text x="914" y="501" class="boxlbl" fill="#2f6fb0">.2 Resolver</text>
  <text x="914" y="517" class="sub">same pattern as A</text>
  <rect x="1065" y="481" width="155" height="52" rx="6" fill="#fff8e1" stroke="#c79100" stroke-width="1.5"/>
  <text x="1079" y="501" class="boxlbl" fill="#a07800">Shared rule assoc.</text>
  <text x="1079" y="517" class="sub">on-prem fwd rule</text>

  <!-- ARROWS -->
  <!-- PHZ assoc to central VPC (green, into network vpc) -->
  <path d="M900,150 C760,150 700,180 612,210" fill="none" stroke="#2e7d32" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <!-- PHZ assoc to spoke (green, option A) -->
  <path d="M905,205 C720,260 760,360 1050,385" fill="none" stroke="#2e7d32" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arrowGreen)"/>
  <!-- on-prem -> inbound (blue) -->
  <path d="M150,180 C150,470 360,244 418,244" fill="none" stroke="#1565c0" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <!-- AWS->on-prem outbound rule (orange) -->
  <path d="M720,290 C720,250 380,250 262,180" fill="none" stroke="#e65100" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <!-- RAM share rules to spokes (purple) -->
  <path d="M815,348 C950,348 1010,360 1065,378" fill="none" stroke="#7b3fa0" stroke-width="2" marker-end="url(#arrowPurple)"/>
  <path d="M815,360 C950,440 1010,480 1065,500" fill="none" stroke="#7b3fa0" stroke-width="2" marker-end="url(#arrowPurple)"/>

  <!-- LEGEND -->
  <rect x="40" y="575" width="1200" height="340" rx="10" fill="#fff" stroke="#cbd2d9" stroke-width="1.5"/>
  <text x="60" y="602" class="acctlbl" fill="#1f2933">PLACEMENT &amp; RESOLVER RULES</text>

  <text x="60" y="628" class="legend"><tspan font-weight="700" fill="#5e2b80">PHZ → Shared-Services account.</tspan> Associated cross-account to (a) the central resolver VPC, and (b) each spoke VPC if using direct association (Option A).</text>
  <text x="60" y="650" class="legend"><tspan font-weight="700" fill="#52606d">Resolver endpoints → Network account.</tspan> They must sit in the VPC with the Direct Connect path so on-prem is reachable both ways.</text>

  <line x1="60" y1="676" x2="100" y2="676" stroke="#2e7d32" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <text x="110" y="680" class="legend"><tspan font-weight="700">① AWS spoke → AWS private:</tspan> Option A — associate PHZ directly to spoke VPC (no rule). Option B — FORWARD rule for aws.example.internal → inbound endpoint IPs, RAM-shared to spokes.</text>

  <line x1="60" y1="702" x2="100" y2="702" stroke="#1565c0" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <text x="110" y="706" class="legend"><tspan font-weight="700">② On-prem → AWS private:</tspan> on-prem conditional forwarder → inbound endpoint IPs over DX. Inbound endpoint resolves because PHZ is associated to its VPC. No Resolver rule needed.</text>

  <line x1="60" y1="728" x2="100" y2="728" stroke="#e65100" stroke-width="3" marker-end="url(#arrowOrange)"/>
  <text x="110" y="732" class="legend"><tspan font-weight="700">③ AWS → on-prem:</tspan> FORWARD rule per on-prem zone (corp.example.com) → on-prem DNS IPs, executed by the outbound endpoint, RAM-shared and associated to every spoke VPC.</text>

  <line x1="60" y1="754" x2="100" y2="754" stroke="#7b3fa0" stroke-width="3" marker-end="url(#arrowPurple)"/>
  <text x="110" y="758" class="legend"><tspan font-weight="700">RAM sharing:</tspan> TGW + all Resolver forwarding rules shared from network account to every spoke; PHZ associations authorized from shared-services.</text>

  <text x="60" y="788" class="legend" font-weight="700" fill="#1f2933">Resolver rules to create (all in Network account, then RAM-share):</text>
  <text x="60" y="808" class="legend">  • FORWARD  corp.example.com  → [on-prem DNS IPs]            (AWS → on-prem)  — associate to ALL VPCs</text>
  <text x="60" y="826" class="legend">  • FORWARD  &lt;each additional on-prem zone&gt;  → [on-prem DNS IPs]</text>
  <text x="60" y="844" class="legend">  • FORWARD  aws.example.internal  → [inbound endpoint IPs]   (only if Option B / hub-forward) — associate to spoke VPCs</text>
  <text x="60" y="862" class="legend" font-style="italic" fill="#616e7c">  No rule is needed for spoke→PHZ if you use Option A (direct cross-account PHZ association). On-prem→PHZ never needs a rule.</text>
  <text x="60" y="888" class="legend"><tspan font-weight="700" fill="#7b3fa0">Reminder:</tspan> TGW carries packets only. DNS works via PHZ associations + Resolver rules, not via TGW routing.</text>
</svg>
