<svg width="680" height="700" viewBox="0 0 680 700" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>DoH proxy HA architecture serving EC2, ECS, EKS, and Lambda</title>
  <desc>Network Load Balancer in front of DoH proxy EC2 instances in three availability zones, with all compute services pointing to the NLB for DNS resolution.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#444441" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#534AB7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#BA7517" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#185FA5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="680" height="700" fill="#f8f8f6"/>

  <!-- VPC outer -->
  <rect x="20" y="20" width="640" height="660" rx="16" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
  <text x="340" y="46" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0C447C">AWS VPC</text>

  <!-- EC2 box -->
  <rect x="40" y="64" width="120" height="52" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
  <text x="100" y="86" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#3C3489">EC2</text>
  <text x="100" y="101" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#534AB7">DHCP options set</text>
  <text x="100" y="113" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#534AB7">→ NLB IP</text>

  <!-- ECS box -->
  <rect x="180" y="64" width="120" height="52" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
  <text x="240" y="86" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#3C3489">ECS</text>
  <text x="240" y="101" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#534AB7">task def dnsServers</text>
  <text x="240" y="113" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#534AB7">→ NLB IP</text>

  <!-- EKS box -->
  <rect x="320" y="64" width="120" height="52" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
  <text x="380" y="86" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#3C3489">EKS</text>
  <text x="380" y="101" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#534AB7">CoreDNS upstream</text>
  <text x="380" y="113" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#534AB7">→ NLB IP</text>

  <!-- Lambda box -->
  <rect x="460" y="64" width="120" height="52" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
  <text x="520" y="86" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#3C3489">Lambda</text>
  <text x="520" y="101" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#534AB7">VPC-attached</text>
  <text x="520" y="113" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#534AB7">inherits DHCP</text>

  <!-- Arrows from compute to NLB -->
  <line x1="100" y1="116" x2="200" y2="168" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow-purple)"/>
  <line x1="240" y1="116" x2="270" y2="168" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow-purple)"/>
  <line x1="380" y1="116" x2="340" y2="168" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow-purple)"/>
  <line x1="520" y1="116" x2="420" y2="168" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow-purple)"/>

  <!-- NLB -->
  <rect x="160" y="168" width="360" height="52" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.8"/>
  <text x="340" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#633806">Network Load Balancer</text>
  <text x="340" y="207" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#854F0B">TCP/UDP :53 — cross-zone, health check TCP :53</text>

  <!-- Arrows NLB to AZ proxies -->
  <line x1="220" y1="220" x2="140" y2="282" stroke="#BA7517" stroke-width="1.5" marker-end="url(#arrow-amber)"/>
  <line x1="340" y1="220" x2="340" y2="282" stroke="#BA7517" stroke-width="1.5" marker-end="url(#arrow-amber)"/>
  <line x1="460" y1="220" x2="540" y2="282" stroke="#BA7517" stroke-width="1.5" marker-end="url(#arrow-amber)"/>

  <!-- AZ-a container -->
  <rect x="40" y="282" width="190" height="160" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
  <text x="135" y="304" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#085041">AZ-a</text>
  <rect x="58" y="316" width="154" height="56" rx="8" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.8"/>
  <text x="135" y="337" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#04342C">DoH proxy EC2</text>
  <text x="135" y="353" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#085041">Unbound :53</text>
  <text x="135" y="367" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#085041">forwards DoT/DoH</text>
  <rect x="58" y="384" width="154" height="44" rx="8" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.8"/>
  <text x="135" y="403" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#04342C">ASG — min 1</text>
  <text x="135" y="419" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#085041">replaces on health fail</text>

  <!-- AZ-b container -->
  <rect x="245" y="282" width="190" height="160" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
  <text x="340" y="304" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#085041">AZ-b</text>
  <rect x="263" y="316" width="154" height="56" rx="8" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.8"/>
  <text x="340" y="337" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#04342C">DoH proxy EC2</text>
  <text x="340" y="353" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#085041">Unbound :53</text>
  <text x="340" y="367" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#085041">forwards DoT/DoH</text>
  <rect x="263" y="384" width="154" height="44" rx="8" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.8"/>
  <text x="340" y="403" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#04342C">ASG — min 1</text>
  <text x="340" y="419" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#085041">replaces on health fail</text>

  <!-- AZ-c container -->
  <rect x="450" y="282" width="190" height="160" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
  <text x="545" y="304" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#085041">AZ-c</text>
  <rect x="468" y="316" width="154" height="56" rx="8" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.8"/>
  <text x="545" y="337" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#04342C">DoH proxy EC2</text>
  <text x="545" y="353" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#085041">Unbound :53</text>
  <text x="545" y="367" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#085041">forwards DoT/DoH</text>
  <rect x="468" y="384" width="154" height="44" rx="8" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.8"/>
  <text x="545" y="403" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#04342C">ASG — min 1</text>
  <text x="545" y="419" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#085041">replaces on health fail</text>

  <!-- Arrows AZ proxies to Route 53 Resolver -->
  <line x1="135" y1="442" x2="250" y2="490" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow-teal)"/>
  <line x1="340" y1="442" x2="340" y2="490" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow-teal)"/>
  <line x1="545" y1="442" x2="430" y2="490" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow-teal)"/>

  <!-- Route 53 Resolver -->
  <rect x="160" y="490" width="360" height="52" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
  <text x="340" y="511" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#0C447C">Route 53 Resolver</text>
  <text x="340" y="528" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#185FA5">private hosted zones + outbound forwarding rules</text>

  <!-- Arrows to upstreams -->
  <line x1="270" y1="542" x2="160" y2="594" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <line x1="410" y1="542" x2="520" y2="594" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <!-- Private hosted zone -->
  <rect x="40" y="594" width="200" height="52" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
  <text x="140" y="615" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0C447C">Private hosted zone</text>
  <text x="140" y="631" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#185FA5">internal.example.com</text>
  <text x="140" y="644" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#185FA5">answered within AWS</text>

  <!-- On-premises DNS -->
  <rect x="440" y="594" width="200" height="52" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
  <text x="540" y="615" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#444441">On-premises DNS</text>
  <text x="540" y="631" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#5F5E5A">via outbound endpoint</text>
  <text x="540" y="644" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#5F5E5A">over VPN / DX</text>
</svg>
