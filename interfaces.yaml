---
# System Interface Registry
metadata:
  project: "Enterprise Integration Architecture"
  version: "1.0.0"
  owner: "Architecture Team"
  last_updated: "2026-04-28"

interfaces:
  - id: IF-001
    name: "CRM to Data Warehouse ETL"
    description: "Customer data sync from Salesforce CRM to Snowflake DWH"

    source:
      system: "Salesforce CRM"
      type: "SaaS"
      # environment and host are optional — omitted here
      owner: "Sales Operations"

    target:
      system: "Snowflake Data Warehouse"
      type: "Database"
      environment: "Production"        # optional — included here
      host: "account.snowflakecomputing.com"  # optional — included here
      owner: "Data Engineering"

    transport:
      protocol: "HTTPS"
      port: 443                        # optional — included here
      direction: "unidirectional"

    security:
      authentication:
        method: "OAuth2"
        token_endpoint: "https://login.salesforce.com/services/oauth2/token"
      authorization:
        model: "RBAC"
        roles:
          - "etl_service_account"

    notes:                             # optional — triggers a note in the diagram
      - This is a sample note about the ETL process.
      - It runs nightly to sync data.

    data:
      description: "Customer profiles, opportunities, account records"
      entities:
        - "Account"
        - "Contact"
        - "Opportunity"
      format: "JSON"
      sensitivity: "PII"

    scheduling:
      frequency: "scheduled"
      cron: "0 2 * * *"
      timezone: "UTC"

    execution:
      container: "etl-salesforce-dwh"
      image: "joshuamfrancis/etl-salesforce:1.4.2"
      platform: "Docker"
      orchestrator: "Apache Airflow"

    tags:
      - "etl"
      - "crm"
      - "data-warehouse"

  - id: IF-002
    name: "Order Service to Notification Service"
    description: "Real-time order events pushed to notification microservice"

    source:
      system: "Order Service"
      type: "Microservice"
      owner: "Commerce Team"
      # environment and host omitted — optional

    target:
      system: "Notification Service"
      type: "Microservice"
      owner: "Platform Team"
      # environment and host omitted — optional

    transport:
      protocol: "AMQP"
      # port omitted — optional
      direction: "unidirectional"
      broker: "RabbitMQ"
      queue: "order.events"

    security:
      authentication:
        method: "API_Key"
        header: "X-API-KEY"
      authorization:
        model: "ACL"

    notes:                             # optional — triggers a note in the diagram
      - "This interface uses RabbitMQ for messaging."

    data:
      description: "Order lifecycle events"
      entities:
        - "OrderEvent"
      format: "JSON"
      sensitivity: "Confidential"

    scheduling:
      frequency: "realtime"

    execution:
      container: "order-service"
      image: "joshuamfrancis/order-service:3.1.0"
      platform: "Kubernetes"

    tags:
      - "event-driven"
      - "messaging"

  - id: IF-003
    name: "ERP to Reporting Portal"
    description: "Weekly financial data extract via SFTP"

    source:
      system: "SAP ERP"
      type: "On-Premise"
      environment: "Production"        # optional — included
      host: "sap-erp.company.local"   # optional — included
      owner: "Finance IT"

    target:
      system: "Reporting Portal"
      type: "Web Application"
      owner: "Finance Operations"
      # environment and host omitted — optional

    transport:
      protocol: "SFTP"
      port: 22                         # optional — included
      direction: "unidirectional"

    security:
      authentication:
        method: "Certificate"
        key_path: "/secrets/sftp/erp_rsa_key"
      authorization:
        model: "ACL"
        # permissions omitted — no note generated for this interface

    data:
      description: "Weekly P&L, Balance Sheet, Cost Centre reports"
      format: "CSV"
      sensitivity: "Confidential"

    scheduling:
      frequency: "scheduled"
      cron: "0 6 * * 1"
      timezone: "UTC"

    execution:
      container: "sap-sftp-exporter"
      image: "joshuamfrancis/sap-exporter:2.0.1"
      platform: "Docker"

    tags:
      - "finance"
      - "reporting"
      - "sftp"