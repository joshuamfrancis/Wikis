<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1110" viewBox="0 0 1240 1110" role="img" aria-labelledby="t d">
<title id="t">Controls by layer: AI/MCP access to backend systems</title>
<desc id="d">Seven layers from AI client to backend system, split by a trust boundary between the AI team (consumer) and the backend systems team (provider), with the controls applied at each layer.</desc>
<rect width="1240" height="1110" fill="#FFFFFF"/>
<text x="70" y="112" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#2F5597" text-anchor="start">AI TEAM  ·  consumer  ·  controls attested in onboarding and verified in load test T21</text>
<rect x="70" y="126" width="1140" height="83" rx="8" fill="#EAF1FB" stroke="#2F5597" stroke-width="1.5"/>
<rect x="70" y="126" width="230" height="83" rx="8" fill="#FFFFFF" fill-opacity="0.65" stroke="#2F5597" stroke-width="1.5"/>
<circle cx="96" cy="152" r="13" fill="#2F5597"/>
<text x="96" y="157" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="118" y="157" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#2F5597" text-anchor="start">AI client / host</text>
<text x="84" y="180" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#444444" text-anchor="start">User-facing app</text>
<circle cx="322" cy="148" r="2.6" fill="#2F5597"/>
<text x="332" y="152" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#1F1F1F" text-anchor="start">End-user sign-in with corporate SSO + MFA (OAuth 2.1 + PKCE)</text>
<circle cx="322" cy="167" r="2.6" fill="#2F5597"/>
<text x="332" y="171" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#1F1F1F" text-anchor="start">User identity taken only from the verified token, never from tool arguments (CoC-16)</text>
<circle cx="322" cy="186" r="2.6" fill="#2F5597"/>
<text x="332" y="190" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#1F1F1F" text-anchor="start">Human confirmation for consequential actions (n/a while read-only)</text>
<rect x="70" y="221" width="1140" height="83" rx="8" fill="#EAF1FB" stroke="#2F5597" stroke-width="1.5"/>
<rect x="70" y="221" width="230" height="83" rx="8" fill="#FFFFFF" fill-opacity="0.65" stroke="#2F5597" stroke-width="1.5"/>
<circle cx="96" cy="247" r="13" fill="#2F5597"/>
<text x="96" y="252" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="118" y="252" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#2F5597" text-anchor="start">Agent (MCP client)</text>
<text x="84" y="275" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#444444" text-anchor="start">Model decides; agent sends tools/call</text>
<circle cx="322" cy="243" r="2.6" fill="#2F5597"/>
<text x="332" y="247" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#1F1F1F" text-anchor="start">Caps tool calls per turn and per session, so the model can't loop (CoC-12.10)</text>
<circle cx="322" cy="262" r="2.6" fill="#2F5597"/>
<text x="332" y="266" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#1F1F1F" text-anchor="start">No automatic re-run of a tool that returned an error (CoC-12.1)</text>
<circle cx="322" cy="281" r="2.6" fill="#2F5597"/>
<text x="332" y="285" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#1F1F1F" text-anchor="start">Treats tool results, incl. free-text fields from backends, as untrusted (CoC-21)</text>
<rect x="70" y="316" width="1140" height="83" rx="8" fill="#EAF1FB" stroke="#2F5597" stroke-width="1.5"/>
<rect x="70" y="316" width="230" height="83" rx="8" fill="#FFFFFF" fill-opacity="0.65" stroke="#2F5597" stroke-width="1.5"/>
<circle cx="96" cy="342" r="13" fill="#2F5597"/>
<text x="96" y="347" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="118" y="347" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#2F5597" text-anchor="start">MCP gateway (optional)</text>
<text x="84" y="370" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#444444" text-anchor="start">Single entry point</text>
<circle cx="322" cy="338" r="2.6" fill="#2F5597"/>
<text x="332" y="342" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#1F1F1F" text-anchor="start">Token validation (issuer, audience, expiry) and per-tool authorisation</text>
<circle cx="322" cy="357" r="2.6" fill="#2F5597"/>
<text x="332" y="361" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#1F1F1F" text-anchor="start">Tool metadata pinning; per-user rate limits; audit of every tool call</text>
<circle cx="322" cy="376" r="2.6" fill="#2F5597"/>
<text x="332" y="380" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#1F1F1F" text-anchor="start">No retries of its own</text>
<rect x="70" y="411" width="1140" height="159" rx="8" fill="#EAF1FB" stroke="#2F5597" stroke-width="1.5"/>
<rect x="70" y="411" width="230" height="159" rx="8" fill="#FFFFFF" fill-opacity="0.65" stroke="#2F5597" stroke-width="1.5"/>
<circle cx="96" cy="437" r="13" fill="#2F5597"/>
<text x="96" y="442" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="118" y="442" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#2F5597" text-anchor="start">MCP server</text>
<text x="84" y="465" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#444444" text-anchor="start">Executes the tool code</text>
<circle cx="322" cy="433" r="2.6" fill="#2F5597"/>
<text x="332" y="437" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#1F1F1F" text-anchor="start">Calls only operations in our published catalogue (CoC-03); filters and pagination (CoC-11)</text>
<circle cx="322" cy="452" r="2.6" fill="#2F5597"/>
<text x="332" y="456" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#1F1F1F" text-anchor="start">Timeouts, max 3 attempts with backoff + jitter, no retry of timeouts, honours Retry-After (CoC-12)</text>
<circle cx="322" cy="471" r="2.6" fill="#2F5597"/>
<text x="332" y="475" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#1F1F1F" text-anchor="start">Circuit breaker per backend and retry budget ≤ 10% (CoC-12.6, 12.7); caches reference data (CoC-13)</text>
<circle cx="322" cy="490" r="2.6" fill="#2F5597"/>
<text x="332" y="494" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#1F1F1F" text-anchor="start">User-specific data: OAuth token from authorization code grant, read-only scopes (CoC-05a);</text>
<text x="332" y="513" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#1F1F1F" text-anchor="start">SAML exchanged for OAuth, never browser-automated (CoC-05c); X-Correlation-ID always</text>
<circle cx="322" cy="528" r="2.6" fill="#2F5597"/>
<text x="332" y="532" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#1F1F1F" text-anchor="start">Otherwise client credentials + asserted user (CoC-05d); service-account PAT only if no OAuth (CoC-05e)</text>
<circle cx="322" cy="547" r="2.6" fill="#2F5597"/>
<text x="332" y="551" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#1F1F1F" text-anchor="start">Secrets, keys and PATs in vault, never in code or prompts (CoC-06); restricted egress (CoC-23)</text>
<line x1="62" y1="592" x2="1210" y2="592" stroke="#C00000" stroke-width="2.5" stroke-dasharray="10 6"/>
<rect x="440" y="579" width="580" height="26" rx="13" fill="#FFFFFF" stroke="#C00000" stroke-width="1.5"/>
<text x="730" y="597" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#C00000" text-anchor="middle">TRUST BOUNDARY  ·  controls below hold whatever the consumer does</text>
<text x="70" y="626" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#2E7D4F" text-anchor="start">BACKEND SYSTEMS TEAM  ·  provider  ·  controls enforced</text>
<rect x="70" y="640" width="930" height="140" rx="8" fill="#EAF6EE" stroke="#2E7D4F" stroke-width="1.5"/>
<rect x="70" y="640" width="230" height="140" rx="8" fill="#FFFFFF" fill-opacity="0.65" stroke="#2E7D4F" stroke-width="1.5"/>
<circle cx="96" cy="666" r="13" fill="#2E7D4F"/>
<text x="96" y="671" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">5</text>
<text x="118" y="671" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#2E7D4F" text-anchor="start">F5 BIG-IP</text>
<text x="84" y="694" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#444444" text-anchor="start">API gateway per backend</text>
<circle cx="322" cy="662" r="2.6" fill="#2E7D4F"/>
<text x="332" y="666" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#1F1F1F" text-anchor="start">Source IP allowlist (CoC-02); TLS 1.2+ (CoC-04)</text>
<circle cx="322" cy="681" r="2.6" fill="#2E7D4F"/>
<text x="332" y="685" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#1F1F1F" text-anchor="start">Method and path allowlist: catalogue operations only (CoC-03)</text>
<circle cx="322" cy="700" r="2.6" fill="#2E7D4F"/>
<text x="332" y="704" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#1F1F1F" text-anchor="start">Connection and rate limits per consumer; fast 429 + Retry-After (CoC-10)</text>
<circle cx="322" cy="719" r="2.6" fill="#2E7D4F"/>
<text x="332" y="723" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#1F1F1F" text-anchor="start">Validates OAuth tokens: issuer, audience, expiry, scope, grant, client</text>
<circle cx="322" cy="738" r="2.6" fill="#2E7D4F"/>
<text x="332" y="742" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#1F1F1F" text-anchor="start">Sets X-On-Behalf-Of from the token; strips client identity headers</text>
<circle cx="322" cy="757" r="2.6" fill="#2E7D4F"/>
<text x="332" y="761" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#1F1F1F" text-anchor="start">SSO onward as the user (Kerberos / trusted header); kill switch (CoC-24)</text>
<rect x="70" y="792" width="930" height="102" rx="8" fill="#EAF6EE" stroke="#2E7D4F" stroke-width="1.5"/>
<rect x="70" y="792" width="230" height="102" rx="8" fill="#FFFFFF" fill-opacity="0.65" stroke="#2E7D4F" stroke-width="1.5"/>
<circle cx="96" cy="818" r="13" fill="#2E7D4F"/>
<text x="96" y="823" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">6</text>
<text x="118" y="823" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#2E7D4F" text-anchor="start">Read interface</text>
<text x="84" y="846" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#444444" text-anchor="start">How data is read</text>
<circle cx="322" cy="814" r="2.6" fill="#2E7D4F"/>
<text x="332" y="818" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#1F1F1F" text-anchor="start">Read path: P1 replica, P2 ODS, P3 read-only views, P4 application API</text>
<circle cx="322" cy="833" r="2.6" fill="#2E7D4F"/>
<text x="332" y="837" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#1F1F1F" text-anchor="start">Chosen by where access rules live (data-driven, code-driven, external)</text>
<circle cx="322" cy="852" r="2.6" fill="#2E7D4F"/>
<text x="332" y="856" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#1F1F1F" text-anchor="start">Side-effect-checked operations; max page size; required filters</text>
<circle cx="322" cy="871" r="2.6" fill="#2E7D4F"/>
<text x="332" y="875" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#1F1F1F" text-anchor="start">Field minimisation and masking of sensitive data (CoC-18)</text>
<rect x="70" y="906" width="930" height="140" rx="8" fill="#EAF6EE" stroke="#2E7D4F" stroke-width="1.5"/>
<rect x="70" y="906" width="230" height="140" rx="8" fill="#FFFFFF" fill-opacity="0.65" stroke="#2E7D4F" stroke-width="1.5"/>
<circle cx="96" cy="932" r="13" fill="#2E7D4F"/>
<text x="96" y="937" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">7</text>
<text x="118" y="937" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#2E7D4F" text-anchor="start">Backend system</text>
<text x="84" y="960" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#444444" text-anchor="start">System of record</text>
<circle cx="322" cy="928" r="2.6" fill="#2E7D4F"/>
<text x="332" y="932" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#1F1F1F" text-anchor="start">Tier 1: receives the user via BIG-IP SSO or validates the OAuth token</text>
<circle cx="322" cy="947" r="2.6" fill="#2E7D4F"/>
<text x="332" y="951" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#1F1F1F" text-anchor="start">Tier 2–3 fallback: client credentials / PAT acting as the user; read-only role</text>
<circle cx="322" cy="966" r="2.6" fill="#2E7D4F"/>
<text x="332" y="970" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#1F1F1F" text-anchor="start">Resource caps (Resource Governor / Resource Manager / WLM), tighter in batch</text>
<circle cx="322" cy="985" r="2.6" fill="#2E7D4F"/>
<text x="332" y="989" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#1F1F1F" text-anchor="start">Access control options A–H: coarse, row-level security on user context,</text>
<text x="332" y="1008" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#1F1F1F" text-anchor="start">app API acting as the user, entitlements, production permission check</text>
<circle cx="322" cy="1023" r="2.6" fill="#2E7D4F"/>
<text x="332" y="1027" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#1F1F1F" text-anchor="start">Alert on write attempts; audit with end-user identity and correlation ID</text>
<rect x="1015" y="640" width="195" height="406" rx="8" fill="#FFF5E3" stroke="#B26B00" stroke-width="1.5"/>
<text x="1112" y="668" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#8A5300" text-anchor="middle">Monitoring + SIEM</text>
<text x="1112" y="687" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#8A5300" text-anchor="middle">backend team</text>
<text x="1030" y="714.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="normal" fill="#3A2A10" text-anchor="start">Volume per consumer and</text>
<text x="1030" y="730.5" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="normal" fill="#3A2A10" text-anchor="start">per user</text>
<text x="1030" y="763.5" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="normal" fill="#3A2A10" text-anchor="start">Quota use &gt; 80%</text>
<text x="1030" y="796.5" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="normal" fill="#3A2A10" text-anchor="start">Retry rate over budget;</text>
<text x="1030" y="813.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="normal" fill="#3A2A10" text-anchor="start">calls during Retry-After</text>
<text x="1030" y="846.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="normal" fill="#3A2A10" text-anchor="start">Write attempts</text>
<text x="1030" y="879.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="normal" fill="#3A2A10" text-anchor="start">Missing user context</text>
<text x="1030" y="912.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="normal" fill="#3A2A10" text-anchor="start">Unusual read volume</text>
<text x="1030" y="928.5" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="normal" fill="#3A2A10" text-anchor="start">(exfiltration signal)</text>
<text x="1030" y="961.5" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="normal" fill="#3A2A10" text-anchor="start">Correlation ID joins our</text>
<text x="1030" y="978.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="normal" fill="#3A2A10" text-anchor="start">logs to the AI team's</text>
<line x1="44" y1="132" x2="44" y2="1032" stroke="#7F7F7F" stroke-width="3"/>
<polygon points="36,1030 52,1030 44,1046" fill="#7F7F7F"/>
<text x="30" y="348" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#595959" text-anchor="middle" transform="rotate(-90 30 348)">Request flow</text>
<text x="70" y="1084" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#595959" text-anchor="start">CoC = Conditions of Connection (D1). Read paths, identity tiers and access options: Backend-Side Solution Design (D2) §3.2, §3.3, §3.6.</text>
<text x="30" y="46" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#1F3864" text-anchor="start">Controls by layer: AI/MCP access to backend systems</text>
<text x="30" y="72" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#595959" text-anchor="start">Read-only access to legacy backends, with F5 BIG-IP as the API gateway and OAuth 2.0 credentials</text>
<rect x="860" y="30" width="18" height="14" rx="3" fill="#EAF1FB" stroke="#2F5597"/>
<text x="886" y="42" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="normal" fill="#1F1F1F" text-anchor="start">AI team (consumer)</text>
<rect x="860" y="54" width="18" height="14" rx="3" fill="#EAF6EE" stroke="#2E7D4F"/>
<text x="886" y="66" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="normal" fill="#1F1F1F" text-anchor="start">Backend team (provider)</text>
<rect x="1050" y="30" width="18" height="14" rx="3" fill="#FFF5E3" stroke="#B26B00"/>
<text x="1076" y="42" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="normal" fill="#1F1F1F" text-anchor="start">Monitoring</text>
<line x1="1050" y1="61" x2="1068" y2="61" stroke="#C00000" stroke-width="2.5" stroke-dasharray="5 3"/>
<text x="1076" y="66" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="normal" fill="#1F1F1F" text-anchor="start">Trust boundary</text>
</svg>